<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
     <style>
     body {
         font-family: Arial, Helvetica, sans-serif;
         background-color: #f0f8ff;
         text-align: center;
         padding-top: 50px;
     }

     label {
       display: block;
       margin-top: 15px;
       font-size: 18px;
       color: #333;
     }

     input {
        padding: 10px;
        width: 250px;
        font-size: 16px;
        border: 2px solid #4caf50;
        border-radius: 8px;
        margin-top: 5px;
     }

     button {
        margin-top: 20px;
        padding: 10px 25px;
        font-size: 16px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
     }

     button:hover {
        background-color: #45a049;
     }

     #result {
        margin-top: 30px;
        font-size: 20px;
        color: #1a1a1a;
        font-weight: bold;
     }

     </style>

    <script>
        function showMessage() {
            let name = document.getElementById("nameInput").value;

            let age = document.getElementById("ageInput").value;

            let color = document.getElementById("colorInput").value;

            let message = "salam, " + name + "! Sen " + age + " yasindasan ve sevdiyin reng "+ color + " dir.";

            document.getElementById("result").innerText = message;
        }
    </script>
</head>
<body>
    <label for="">Adını  yaz:</label>
    <input type="text" id="nameInput"><br><br>

    <label for="">Yaşını  yaz:</label>
    <input type="number" id="ageInput"><br><br>

    <label for="">Sevdiyin reng</label>
    <input type="text" id="colorInput"><br><br>

    <button onclick="showMessage()">Göstər</button>

    <p id="result"></p>
</body>
</html>
